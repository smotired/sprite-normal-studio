[package]
name = "studio"
version = "0.1.0"
edition = "2024"
publish = false
authors = ["Sam Hill <smotired@gmail.com>"]
description = "Main binary crate for the Sprite Normal Studio application"

[dependencies]
rendering = { path = "../rendering" }
eframe = { version = "0.36.2", features = ["wgpu"] }
rfd = "0.17.2"
env_logger = "0.11.11"
egui_extras = { version = "0.36.2", features = ["all_loaders"] }
image = "0.25.10"
