eframe = { version = "0.36.2", features = ["wgpu"] }
egui_extras = { version = "0.36.2", features = ["all_loaders"] }
rfd = "0.17.2"
env_logger = "0.11.11"
image = "0.25.10"
anyhow = { workspace = true }