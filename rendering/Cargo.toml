[package]
name = "rendering"
version = "0.5.0"
edition = "2024"
publish = false
authors = ["Sam Hill <smotired@gmail.com>"]
description = "Library crate for rendering the sprite, normal map, and UI tools"

[dependencies]
studio_math = { workspace = true }
controller = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true }

[dev-dependencies]
# A GPU-less device, so tests can render with a whole Controller
wgpu = { workspace = true, features = ["noop"] }
controller = { workspace = true, features = ["shader-validation"] }
